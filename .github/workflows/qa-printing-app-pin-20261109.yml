name: QA Otzaria-pinned printing Windows native build

on:
  push:
    branches:
      - 'palmoni5/qa-printing-app-pin-20261109'

jobs:
  windows:
    name: PDFium 5200 private printing DLL / ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-2025, windows-11-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter x64
        if: matrix.runner == 'windows-2025'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.7'
          cache: true

      - name: Setup Flutter ARM64 from stable Git branch
        if: matrix.runner == 'windows-11-arm'
        shell: pwsh
        run: |
          git clone https://github.com/flutter/flutter.git --depth 1 --branch stable C:\flutter
          "C:\flutter\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          C:\flutter\bin\flutter.bat config --no-enable-android
          C:\flutter\bin\flutter.bat doctor -v

      - name: Create desktop example project
        shell: pwsh
        working-directory: printing/example
        run: flutter create -t app --no-overwrite --org net.nfet --project-name example .

      - name: Build app-pinned printing native plugin
        shell: pwsh
        working-directory: printing/example
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: flutter build windows --debug --verbose

      - name: Require isolated printing PDFium DLL in build output
        shell: pwsh
        working-directory: printing/example
        run: |
          $bundles = @(Get-ChildItem -Path build/windows -Recurse -File -Filter pdfium_printing.dll)
          $bundles | ForEach-Object { Write-Host $_.FullName }
          if ($bundles.Count -eq 0) { throw 'Expected private pdfium_printing.dll was not produced' }
