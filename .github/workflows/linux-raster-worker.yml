name: Linux raster worker

on:
  pull_request:
    paths:
      - 'printing/linux/**'
      - 'printing/example/integration_test/linux_raster_worker_test.dart'
      - 'printing/example/pubspec.yaml'
      - '.github/workflows/linux-raster-worker.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-raster:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            channel: stable
          - runner: ubuntu-24.04-arm
            # Stable ARM64 discovery is currently broken in flutter-action;
            # the repository's existing ARM job uses master artifacts too.
            channel: master
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ matrix.channel }}
      - name: Enable Linux desktop
        run: flutter config --enable-linux-desktop
      - name: Install Linux build and display dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang cmake ninja-build pkg-config libgtk-3-dev xvfb
      - name: Prepare example platform files
        working-directory: printing/example
        run: flutter create -t app --no-overwrite --org net.nfet --project-name example .
      - name: Build Linux example
        working-directory: printing/example
        shell: bash
        run: |
          set -euo pipefail
          # PDFium is downloaded from GitHub by the upstream CMake helper and
          # occasionally returns a transient 5xx. Retry from a clean CMake
          # build tree; never relax the downloaded artifact itself.
          for attempt in 1 2 3; do
            if flutter build linux; then
              exit 0
            fi
            rm -rf build/linux
            sleep $((attempt * 4))
          done
          exit 1
      - name: Run native raster responsiveness integration test
        working-directory: printing/example
        run: xvfb-run -a flutter test integration_test/linux_raster_worker_test.dart -d linux
