name: Linux raster worker

on:
  pull_request:
    paths:
      - 'printing/linux/**'
      - 'printing/example/integration_test/linux_raster_worker_test.dart'
      - 'printing/example/pubspec.yaml'
      - '.github/workflows/linux-raster-worker.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-raster:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            channel: stable
          - runner: ubuntu-24.04-arm
            # Stable ARM64 discovery is currently broken in flutter-action;
            # the repository's existing ARM job uses master artifacts too.
            channel: master
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ matrix.channel }}
      - name: Enable Linux desktop
        run: flutter config --enable-linux-desktop
      - name: Install Linux build and display dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang cmake ninja-build pkg-config libgtk-3-dev xvfb
      - name: Prepare example platform files
        working-directory: printing/example
        run: flutter create -t app --no-overwrite --org net.nfet --project-name example .
      - name: Prefetch pinned PDFium through the GitHub API
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          arch="${{ runner.arch }}"
          case "$arch" in
            X64) asset='pdfium-linux-x64.tgz' ;;
            ARM64) asset='pdfium-linux-arm64.tgz' ;;
            *) echo "::error::unsupported runner arch $arch"; exit 2 ;;
          esac
          release_url='https://api.github.com/repos/bblanchon/pdfium-binaries/releases/tags/chromium%2F5200'
          release_json="$(curl --fail --location --retry 8 --retry-all-errors --retry-delay 3 \
            -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "$release_url")"
          asset_url="$(jq -r --arg name "$asset" '.assets[] | select(.name == $name) | .url' <<<"$release_json")"
          test -n "$asset_url" && test "$asset_url" != null
          mkdir -p "$RUNNER_TEMP/pdfium"
          curl --fail --location --retry 8 --retry-all-errors --retry-delay 3 --max-time 300 \
            -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/octet-stream' \
            "$asset_url" -o "$RUNNER_TEMP/pdfium.tgz"
          tar -xzf "$RUNNER_TEMP/pdfium.tgz" -C "$RUNNER_TEMP/pdfium"
          test -f "$RUNNER_TEMP/pdfium/PDFiumConfig.cmake"
          echo "PRINTING_PDFIUM_DIR=$RUNNER_TEMP/pdfium" >> "$GITHUB_ENV"

      - name: Build Linux example
        working-directory: printing/example
        run: flutter build linux
      - name: Run native raster responsiveness integration test
        working-directory: printing/example
        run: xvfb-run -a flutter test integration_test/linux_raster_worker_test.dart -d linux
